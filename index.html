<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir PWA - Offline & Export PNG</title>
    <!-- Pengaturan PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; margin: 0; background: #334155; }
        
        #left-panel { flex: 1; padding: 20px; color: white; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        h2 { margin-top: 0; font-size: 20px; text-align: center; border-bottom: 2px solid #475569; padding-bottom: 10px; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #cbd5e1; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border-radius: 6px; border: none; font-size: 14px; }
        
        .btn-tambah { background: #2563eb; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 15px; }
        .btn-tambah:hover { background: #1d4ed8; }

        .calc-container { background: #1e293b; padding: 10px; border-radius: 8px; }
        .calc-display { text-align: right; font-size: 22px; padding: 10px; background: #0f172a; color: #38bdf8; border-radius: 4px; margin-bottom: 8px; font-family: monospace; word-break: break-all; min-height: 45px; }
        .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .calc-keys button { padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; background: #475569; color: white; cursor: pointer; }
        .calc-keys button:hover { background: #64748b; }
        .calc-keys button.btn-c { background: #dc2626; }
        .calc-keys button.btn-op { background: #d97706; }

        #right-panel { width: 420px; background: #f8fafc; padding: 20px; display: flex; flex-direction: column; border-left: 2px dashed #cbd5e1; }
        
        .nota-box { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; flex-grow: 1; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .nota-header { text-align: center; font-weight: bold; border-bottom: 2px dashed #000; padding-bottom: 8px; margin-bottom: 10px; font-size: 15px; }
        
        .nota-items-list { flex-grow: 1; overflow-y: auto; max-height: 320px; }
        .nota-row { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; align-items: flex-start; }
        .nota-total { border-top: 2px solid #000; margin-top: 10px; padding-top: 10px; font-weight: bold; display: flex; justify-content: space-between; font-size: 16px; }
        
        .btn-action { width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; border: none; color: white; }
        .btn-download { background: #0284c7; }
        .btn-download:hover { background: #0369a1; }
        .btn-sync { background: #16a34a; }
        .btn-sync:hover { background: #15803d; }
        .btn-reset { background: #475569; }
        .btn-reset:hover { background: #334155; }
        
        .footer-status { font-size: 11px; text-align: center; margin-top: 8px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div>
            <h2>Kalkulator & Input Nota</h2>

            <div class="input-group">
                <label>Tanggal</label>
                <input type="date" id="tanggal" oninput="renderNota()">
            </div>

            <div class="input-group">
                <label>Sheet Tujuan (Nama Pelanggan)</label>
                <input type="text" id="sheetTujuan" placeholder="Contoh: leora" oninput="renderNota()">
            </div>

            <div class="input-group">
                <label>Nama Barang</label>
                <input type="text" id="namaBarang" placeholder="Misal: roblox" oninput="renderNota()">
            </div>

            <div class="input-group">
                <label>Hasil Kalkulasi (Otomatis dari Kalkulator)</label>
                <input type="text" id="hasilKalkulasi" readonly placeholder="0" style="background: #1e293b; color: #38bdf8; font-weight: bold;">
            </div>

            <button class="btn-tambah" onclick="tambahKeNota()">TAMBAH KE NOTA ➕</button>
        </div>

        <!-- Kalkulator -->
        <div class="calc-container">
            <div class="calc-display" id="calcDisplay">0</div>
            <div class="calc-keys">
                <button onclick="calcInput('7')">7</button>
                <button onclick="calcInput('8')">8</button>
                <button onclick="calcInput('9')">9</button>
                <button class="btn-c" onclick="calcClear()">C</button>
                
                <button onclick="calcInput('4')">4</button>
                <button onclick="calcInput('5')">5</button>
                <button onclick="calcInput('6')">6</button>
                <button class="btn-op" onclick="calcInput('+')">+</button>
                
                <button onclick="calcInput('1')">1</button>
                <button onclick="calcInput('2')">2</button>
                <button onclick="calcInput('3')">3</button>
                <button class="btn-op" onclick="calcInput('-')">-</button>
                
                <button onclick="calcInput('0')">0</button>
                <button onclick="calcInput('00')">00</button>
                <button onclick="calcInput('*')">×</button>
                <button class="btn-op" onclick="calcCalculate()">=</button>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <div class="nota-box" id="areaNotaPNG">
            <div class="nota-header">NOTA BELANJA SEMENTARA</div>
            <div style="font-size: 11px; text-align: center; margin-bottom: 8px; color: #555;" id="infoNotaHeader">Tujuan: - | Tgl: -</div>
            
            <div class="nota-items-list" id="notaItemsContainer">
            </div>

            <div class="nota-total">
                <span>TOTAL :</span>
                <span id="grandTotal">Rp 0</span>
            </div>
        </div>

        <button class="btn-action btn-download" onclick="downloadNotaPNG()">📥 DOWNLOAD NOTA (PNG)</button>
        <button class="btn-action btn-sync" onclick="sinkronkanKeSheet()">🔄 SINKRONKAN KE SHEET</button>
        <button class="btn-action btn-reset" onclick="buatNotaBaru()">🗑️ BUAT NOTA BARU (RESET)</button>
        <div class="footer-status" id="footerStatus">Status: Nota Siap Diisi</div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwh321sCKQYmr_ANIhTavJEYP3tbiekurbEEKMLVBWlb2emw267z6FXJlPJIoaSJezJdg/exec";
        
        document.getElementById('tanggal').valueAsDate = new Date();

        let currentNotaItems = JSON.parse(localStorage.getItem('current_nota_items')) || [];
        let calcExpression = "";
        let displayExpression = "0";
        let currentCalculatedTotal = 0;

        renderNota();

        // Daftarkan Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Terdaftar!"))
            .catch(err => console.log("Gagal daftar SW:", err));
        }

        function calcInput(val) {
            if (calcExpression === "" && (val === '+' || val === '-')) {
                calcExpression = "0" + val;
                displayExpression = "0" + (val === '*' ? '×' : val);
            } else if (calcExpression === "" && val !== '*') {
                calcExpression = val;
                displayExpression = val;
            } else {
                calcExpression += val;
                displayExpression += (val === '*' ? '×' : val);
            }
            document.getElementById('calcDisplay').innerText = displayExpression;
        }

        function calcClear() {
            calcExpression = "";
            displayExpression = "0";
            document.getElementById('calcDisplay').innerText = "0";
            document.getElementById('hasilKalkulasi').value = "";
            currentCalculatedTotal = 0;
            renderNota();
        }

        function calcCalculate() {
            try {
                let sanitized = calcExpression.replace(/[^0-9+\-*.]/g, '');
                let result = Function('"use strict"; return (' + sanitized + ')')();
                
                if (isNaN(result) || !isFinite(result)) throw new Error("Invalid");
                
                currentCalculatedTotal = result;
                document.getElementById('calcDisplay').innerText = result.toLocaleString();
                document.getElementById('hasilKalkulasi').value = result;
                
                renderNota();
            } catch (e) {
                document.getElementById('calcDisplay').innerText = "Error";
                calcExpression = "";
                displayExpression = "0";
                currentCalculatedTotal = 0;
            }
        }

        function tambahKeNota() {
            let tanggal = document.getElementById('tanggal').value;
            let sheetTujuan = document.getElementById('sheetTujuan').value.trim();
            let namaBarang = document.getElementById('namaBarang').value.trim();
            let subtotal = currentCalculatedTotal;

            if (!sheetTujuan) {
                alert("Mohon isi Sheet Tujuan (Nama Pelanggan) terlebih dahulu!");
                return;
            }
            if (subtotal <= 0 || !calcExpression) {
                alert("Hitung nominal barang menggunakan kalkulator terlebih dahulu!");
                return;
            }
            if (!namaBarang) {
                namaBarang = "Barang Tanpa Nama";
            }

            let newItem = {
                id: Date.now(),
                tanggal: tanggal,
                sheetTujuan: sheetTujuan,
                namaBarang: namaBarang,
                rincianText: displayExpression, 
                subtotal: subtotal
            };

            currentNotaItems.push(newItem);
            localStorage.setItem('current_nota_items', JSON.stringify(currentNotaItems));
            
            renderNota();

            document.getElementById('namaBarang').value = "";
            calcClear();
        }

        function renderNota() {
            let container = document.getElementById('notaItemsContainer');
            container.innerHTML = "";
            let grandTotal = 0;
            let currentSheet = document.getElementById('sheetTujuan').value.trim() || "-";
            let currentTgl = document.getElementById('tanggal').value || "-";

            currentNotaItems.forEach((item) => {
                grandTotal += item.subtotal;

                let row = document.createElement('div');
                row.className = 'nota-row';
                row.innerHTML = `
                    <div style="flex: 2;">
                        <b>${item.namaBarang}</b><br>
                        <small style="color: #64748b;">${item.rincianText}</small>
                    </div>
                    <div style="text-align: right; flex: 1;">
                        Rp ${item.subtotal.toLocaleString()}
                    </div>
                `;
                container.appendChild(row);
            });

            let liveNama = document.getElementById('namaBarang').value.trim();
            let liveRincian = displayExpression;
            if (liveNama || (liveRincian && liveRincian !== "0")) {
                let previewRow = document.createElement('div');
                previewRow.className = 'nota-row';
                previewRow.style.opacity = '0.6';
                previewRow.innerHTML = `
                    <div style="flex: 2;">
                        <b>${liveNama || '...'}</b><br>
                        <small style="color: #64748b;">${liveRincian}</small>
                    </div>
                    <div style="text-align: right; flex: 1;">
                        Rp ${currentCalculatedTotal.toLocaleString()}<br>
                        <span style="color: #64748b; font-size: 11px;">(Sedang diketik)</span>
                    </div>
                `;
                container.appendChild(previewRow);
                grandTotal += currentCalculatedTotal;
            }

            document.getElementById('infoNotaHeader').innerText = `Tujuan: ${currentSheet} | Tgl: ${currentTgl}`;
            document.getElementById('grandTotal').innerText = `Rp ${grandTotal.toLocaleString()}`;
            document.getElementById('footerStatus').innerText = `Status: ${currentNotaItems.length} Item dalam Nota`;
        }

        function downloadNotaPNG() {
            if (currentNotaItems.length === 0) {
                alert("Nota masih kosong!");
                return;
            }
            let element = document.getElementById('areaNotaPNG');
            html2canvas(element, { scale: 2 }).then(canvas => {
                let link = document.createElement('a');
                link.download = `Nota-${document.getElementById('sheetTujuan').value.trim() || 'Pelanggan'}-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        async function sinkronkanKeSheet() {
            if (currentNotaItems.length === 0) {
                alert("Tidak ada item di nota yang bisa disinkronkan!");
                return;
            }

            let writingKey = prompt("Masukkan Writing Key untuk sinkron ke Google Sheet:");
            if (!writingKey) {
                alert("Sinkronisasi dibatalkan.");
                return;
            }

            let btn = document.querySelector('.btn-sync');
            btn.innerText = "Sedang Mengirim...";
            btn.disabled = true;

            let successCount = 0;

            for (let item of currentNotaItems) {
                try {
                    let payload = {
                        writingKey: writingKey,
                        tanggal: item.tanggal,
                        sheetTujuan: item.sheetTujuan,
                        namaBarang: item.namaBarang,
                        qty: item.rincianText, 
                        harga: 0,
                        subtotal: item.subtotal
                    };

                    let response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    let resJson = await response.json();
                    if (resJson.status === 'success') {
                        successCount++;
                    } else {
                        alert("Gagal pada item " + item.namaBarang + ": " + (resJson.message || "Kunci salah!"));
                        break;
                    }
                } catch (err) {
                    console.error("Gagal sinkron:", err);
                    alert("Gagal terhubung ke server.");
                    break;
                }
            }

            btn.innerText = "🔄 SINKRONKAN KE SHEET";
            btn.disabled = false;

            if (successCount === currentNotaItems.length) {
                alert(`Berhasil! ${successCount} item telah masuk ke Google Sheet.`);
                buatNotaBaru();
            } else if (successCount > 0) {
                alert(`Sebagian data (${successCount} item) berhasil terkirim.`);
            }
        }

        function buatNotaBaru() {
            if (currentNotaItems.length > 0 && !confirm("Buat nota baru? Nota saat ini akan dibersihkan.")) {
                return;
            }
            currentNotaItems = [];
            localStorage.removeItem('current_nota_items');
            document.getElementById('namaBarang').value = "";
            calcClear();
        }
    </script>
</body>
</html>
