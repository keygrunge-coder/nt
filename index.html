<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir PWA Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; background: #1e293b; color: white; display: flex; height: 100vh; overflow: hidden; }

        /* Kiri: Input & Kalkulator */
        #left-panel { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .input-group { margin-bottom: 10px; }
        .input-group label { font-size: 11px; color: #94a3b8; }
        .input-group input { width: 100%; padding: 8px; border-radius: 4px; border: none; }
        .btn-tambah { background: #2563eb; color: white; border: none; width: 100%; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* Kalkulator */
        .calc-box { background: #334155; padding: 10px; border-radius: 8px; margin-top: 15px; }
        #calcDisplay { background: #0f172a; padding: 10px; text-align: right; font-size: 20px; color: #38bdf8; border-radius: 4px; margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .grid button { padding: 15px; border: none; border-radius: 4px; background: #475569; color: white; font-weight: bold; }

        /* Kanan: Nota */
        #right-panel { width: 350px; background: #f8fafc; color: #333; padding: 15px; border-left: 2px solid #334155; display: flex; flex-direction: column; transition: 0.3s; }
        .nota-box { background: white; padding: 15px; flex-grow: 1; border-radius: 8px; font-size: 12px; }
        .hide { display: none !important; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            #right-panel { width: 100%; height: auto; position: fixed; bottom: 0; z-index: 100; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
        }
    </style>
</head>
<body>

<div id="left-panel">
    <h2 style="text-align:center;">KASIR PWA</h2>
    <div class="input-group"><label>Pelanggan</label><input type="text" id="sheet" placeholder="Nama..."></div>
    <div class="input-group"><label>Barang</label><input type="text" id="barang" placeholder="Nama Barang..."></div>
    <button class="btn-tambah" onclick="tambah()">TAMBAH KE NOTA</button>

    <div class="calc-box">
        <div id="calcDisplay">0</div>
        <div class="grid">
            <button onclick="input('7')">7</button><button onclick="input('8')">8</button><button onclick="input('9')">9</button><button onclick="backspace()" style="background:#ef4444"><</button>
            <button onclick="input('4')">4</button><button onclick="input('5')">5</button><button onclick="input('6')">6</button><button onclick="input('+')" style="background:#d97706">+</button>
            <button onclick="input('1')">1</button><button onclick="input('2')">2</button><button onclick="input('3')">3</button><button onclick="input('-')" style="background:#d97706">-</button>
            <button onclick="input('0')">0</button><button onclick="input('00')">00</button><button onclick="calc()" style="background:#16a34a">=</button><button onclick="clearCalc()" style="background:#64748b">C</button>
        </div>
    </div>
</div>

<div id="right-panel" id="panelNota">
    <button onclick="document.getElementById('right-panel').classList.toggle('hide')" style="background:#64748b; color:white; border:none; padding:5px; margin-bottom:10px;">TUTUP / BUKA NOTA ↕</button>
    <div class="nota-box" id="areaNota">
        <div style="text-align:center; font-weight:bold; border-bottom:1px dashed #000;">NOTA</div>
        <div id="list"></div>
        <div style="border-top:2px solid #000; margin-top:10px; font-weight:bold;">TOTAL: <span id="total">0</span></div>
    </div>
    <button onclick="download()" style="margin-top:10px; padding:10px; background:#0284c7; color:white; border:none;">DOWNLOAD PNG</button>
</div>

<script>
    let items = []; let calcStr = "";
    function input(v) { calcStr += v; document.getElementById('calcDisplay').innerText = calcStr; }
    function backspace() { calcStr = calcStr.slice(0, -1); document.getElementById('calcDisplay').innerText = calcStr || "0"; }
    function clearCalc() { calcStr = ""; document.getElementById('calcDisplay').innerText = "0"; }
    function calc() { try { calcStr = eval(calcStr).toString(); document.getElementById('calcDisplay').innerText = calcStr; } catch { alert("Error"); } }
    
    function tambah() {
        let b = document.getElementById('barang').value;
        let h = document.getElementById('calcDisplay').innerText;
        items.push({b, h});
        let html = ""; let tot = 0;
        items.forEach(i => { html += `<div>${i.b} : ${i.h}</div>`; tot += parseInt(i.h) || 0; });
        document.getElementById('list').innerHTML = html;
        document.getElementById('total').innerText = tot;
    }

    function download() {
        html2canvas(document.getElementById('areaNota')).then(c => {
            let a = document.createElement('a'); a.href = c.toDataURL(); a.download = "nota.png"; a.click();
        });
    }
</script>
</body>
</html>
